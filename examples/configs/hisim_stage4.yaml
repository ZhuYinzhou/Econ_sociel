runner: "episode_runner"
mac: "basic_mac"
learner: "q_learner"

# DDP safety: Stage4 may freeze/skip parts of the model (e.g., belief_network/encoder),
# so some parameters can be unused in a given iteration.
ddp_find_unused_params: true

# ===== Stage4 optimizer knobs (IMPORTANT) =====
# In this codebase, RL optimizers use:
# - belief optimizer lr: belief_net_lr (fallback to lr)
# - encoder optimizer lr: encoder_lr (fallback to lr)
# - mixer optimizer lr: mixer_lr (fallback to lr)
# `train.learning_rate` is NOT used to build these optimizers.
#
# Your intended Stage4 design:
# - Freeze encoder + belief_network (representation)
# - Train policy heads (action_type_head + optional stance_head) + optional s3b_bias_alpha
# So: set belief_net_lr > 0, keep encoder_lr=0, and disable mixer by default.
use_mixer: false
lr: 0.0003
belief_net_lr: 0.0001
encoder_lr: 0.0
mixer_lr: 0.0
weight_decay: 0.0
lambda_sd: 0.0
lambda_m: 0.0

# ===== Stage4 exploration (IMPORTANT to avoid collapse) =====
# BasicMAC default action_selector is "multinomial".
# We enable softmax sampling (instead of greedy argmax) plus epsilon-random exploration.
action_selector: "multinomial"
multinomial_sample_mode: "softmax"
#
# Stronger exploration to avoid early plateau / mode collapse:
# - higher temperature -> softer sampling from logits
# - higher epsilon + longer anneal -> keep random exploration longer
action_temperature: 1.8
epsilon_start: 0.35
epsilon_finish: 0.15
epsilon_anneal_time: 200000
test_greedy: true

# Stage4 (online): multi-agent RL for core users with policy→LLM decoupling and z-based reward.
# This config is intentionally "safer" than hisim_social.yaml:
# - Use categorical z (K=3 distribution) to match your Stage3a dist model
# - Start with z-only reward (no text/GT imitation)
# - Freeze representation modules to avoid noisy reward destabilizing beliefs
# - Short curriculum (5-10 stages first) is controlled by curriculum block

t_max: 500000
test_interval: 2000
test_nepisode: 200

# In sync-stage mode, we treat EACH core user as an "agent slot" with shared weights.
# HiSim default core_users=300 for metoo; keep these consistent.
n_agents: 300
belief_dim: 128
population_belief_dim: 3
text_embed_dim: 1024
batch_size_run: 1
n_actions: 5
max_seq_length: 1024

# Mixer/commitment-related dims (used by LLMQMixer even if you don't call external LLM APIs)
# prompt_embedding_dim is fixed at 2 inside mixer, so num_heads must divide 2 -> {1,2}
prompt_attention_heads: 2
commitment_embedding_dim: 1024

# Transformer agent architecture (required by LLMTransformerAgent)
# Keep consistent with Stage1/2/3a/3b so checkpoints are compatible.
arch:
  entity_dim: 256
  attention_heads: 4
  transformer_blocks: 2
  key_dim: 64
  mlp_hidden_size: 256
  feedforward_size: 1024
  dropout_rate: 0.1
  layer_norm_epsilon: 0.00001

env_action_source: "sync_stage_policy"
enable_llm_rollout: false
llm_model_name: "gpt2"
together_api_key: "${TOGETHER_API_KEY}"
coordinator_model: "gpt-3.5-turbo"
executor_model: "gpt-3.5-turbo"
llm_response_format_json: true
use_nonparam_group_repr: true
population_update_use_group_repr: true
# Match Stage3a BeliefEncoder conditioning so `belief_encoder.th` loads without shape mismatch.
population_update_use_stage: true
# Use the learned brief encoder (trained in Stage3a) to map non-parametric action summaries -> compact briefs.
use_brief_encoder: false
brief_encoder_input_dim: 128
brief_encoder_hidden_dim: 256
brief_encoder_use_stage: false
# Match Stage3a Dirichlet parametrization (rollout/control uses E[z]; no sampling).
population_update_parametrization: "dirichlet"
dirichlet_alpha_min: 0.001

env: "hisim_social_env"
env_args:
  hisim_data_root: "/data/zhuyinzhou/HiSim/data"
  topic: "metoo"
  event: "e1"
  max_question_length: 1024
  max_answer_length: 512
  label2id_path: "/home/zhuyinzhou/MAS/ECON/data/hisim_belief_dataset_metoo_e1/label2id.json"

# env: "hisim_social_env"
# env_args:
#   hisim_data_root: "/data/zhuyinzhou/HiSim/data"
#   topic: "blm"
#   event: "p1"
#   max_question_length: 1024
#   max_answer_length: 512
#   label2id_path: "/home/zhuyinzhou/MAS/ECON/data/hisim_belief_dataset_blm_p1/label2id.json"

  # short episode first (curriculum below will extend)
  n_stages: 10
  # Strict HiSim semantics: same-round concurrent -> unified update (one env.step per stage)
  sync_stage_update: true
  # Safety: assert core user count if you want (set strict_user_counts: true to raise)
  expected_core_users: 300
  # Optional: cap for debugging/smoke; set to 300 for real runs
  max_core_users: 300
  # Optional: mimic HiSim's per-round random order (order does NOT affect info availability in sync mode)
  shuffle_core_users_each_stage: true
  core_users_shuffle_seed: 42
  max_neighbor_posts: 8
  max_population_texts: 20
  max_user_history_lines: 40
  max_recent_self_posts: 6
  group_representation_dim: 128

  # Use learnable dynamics from BeliefEncoder (Stage3a) to update z
  use_secondary_belief_sim: true
  secondary_sim_max_users: 700
  secondary_sim_use_micro_texts: true
  # Disable hand-written ABM updater (we still aggregate counts, but z update uses secondary_z_next)
  population_belief_mode: "categorical3"
  # Structured alignment (EpisodeRunner): when this is "noop", we override env z-update by passing
  # `secondary_z_next` computed from policy's POST-stage aggregate group_repr_next.
  population_z_updater: "noop"

  # Stage4 reward: start simple with z-only reward
  reward_w_action_type: 0.0
  reward_w_stance: 0.0
  reward_w_text: 0.0
  reward_w_z: 1.0
  reward_z_on_stage_end_only: true
  mask_missing_gt: true
  # IMPORTANT:
  # If this threshold is too high, many stages will have z_mask=0 -> reward_z=0 (no learning signal).
  # Your stage4_debug_alignment showed many stages have edge_n < 200, so RL reward becomes too sparse.
  # Start with 50 for better coverage; you can tune (e.g., 0/50/100) after verifying learning dynamics.
  min_edge_labels_for_z_target: 20
  # Optional: soften z_mask (density) instead of hard 0/1 gating. When edge_n < threshold,
  # z_mask becomes edge_n/threshold and reward_z is scaled by z_mask.
  soft_z_mask: true

# === S3b prior bias injection (optional) ===
# Treat S3b as a "preference scorer" and inject its bias into RL logits.
# bias = g_s3b(state); logits[RETWEET]+=alpha*bias, logits[POST]-=alpha*bias
s3b_bias_enabled: true
s3b_bias_mode: "diff01"
# Scheme-2 (recommended): keep the prior but bound it to avoid logit domination / mode collapse.
# In your hisim-s4-8000 run, alpha quickly saturated to max and bias logits became huge (~30),
# which can freeze the policy into near-deterministic actions and hurt reward_z learning.
s3b_bias_alpha: 0.5
s3b_bias_alpha_trainable: false
# Constrain alpha to be non-negative and optionally bounded (alpha = exp(beta))
s3b_bias_alpha_max: 0.8
# Gate bias injection by stance-head confidence (only inject when stance is confident)
s3b_bias_gate_by_stance: true
s3b_bias_stance_min_conf: 0.95

# Curriculum: gradually increase number of stages once training is stable
curriculum:
  enabled: true
  t_env_steps: [20000, 60000]
  n_stages: [7, 10, 13]

# Optional auxiliary: you can keep this loss for logging, but recommend freezing encoder params (below)
z_transition_loss_weight: 0.0
z_transition_loss_type: "kl"

# === Stage4 freezing knobs (new; default false elsewhere) ===
freeze_belief_encoder_in_rl: true
freeze_belief_network_in_rl: true
freeze_stance_head_in_rl: false
freeze_action_type_head_in_rl: false
freeze_mixer_in_rl: false

# Ensure action heads are trained in RL
train_policy_heads_in_rl: true
train_stance_head_in_rl: true

train:
  episodes_per_task: 1
  buffer_size: 128
  batch_size: 32
  update_interval: 5
  optimizer: "adam"
  learning_rate: 0.001
  coordinator_learning_rate: 0.0005
  gamma: 0.99

system:
  use_cuda: true
  device_num: 0
  seed: 42
  debug: true

logging:
  use_tensorboard: true
  log_interval: 1
  save_model: true
  save_model_interval: 2000
  checkpoint_path: "./models"
  log_path: "./logs"
  experiment_name: "hisim-social-stage4-zreward"

